name: CI

on:
  pull_request:
  push:
    branches: [main, 'devin/**']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # package-lock.json is committed — npm ci is the reproducible path.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npx eslint src

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Test
        run: npx vitest run

      - name: Coverage
        run: npx vitest run --coverage --coverage.reporter=lcov
        continue-on-error: true   # informational until threshold is tuned

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./coverage/lcov.info

      - name: Build
        run: npx vite build

  # Real-Postgres regression tests (pgTAP) for the RLS / trigger security
  # fixes. Replays every migration + seed into a throwaway local stack, then
  # runs supabase/tests/database/*.test.sql.
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start local database (applies migrations + seed)
        run: supabase db start
      - name: Run pgTAP tests
        run: supabase test db

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history — leaks hide in old commits
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # audit-ci reads .audit-ci.json — the single allowlisted GHSA is a
      # build-time-only advisory inside the Tailwind v3 toolchain (PostCSS
      # at build time; not bundled or shipped). Remove it with the
      # tailwindcss@4 migration planned alongside the UI redesign.
      - name: Dependency audit (high+ only)
        run: npx audit-ci --config .audit-ci.json
