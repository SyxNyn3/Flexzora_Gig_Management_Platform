name: CI

on:
  pull_request:
  push:
    branches: [main, 'devin/**']

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npx eslint src

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Test
        run: npx vitest run

      - name: Build
        run: npx vite build

  # Real-Postgres regression tests (pgTAP) for the RLS / trigger security
  # fixes. Replays every migration + seed into a throwaway local stack, then
  # runs supabase/tests/database/*.test.sql.
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local database (applies migrations + seed)
        run: supabase db start
      - name: Run pgTAP tests
        run: supabase test db
