name: Deploy to public demo repo (flexzora-live)

on:
  push:
    branches: [main]
  workflow_dispatch:

# The source repo is private — GitHub Pages on the free tier can't serve it.
# Instead, this workflow builds the app and force-pushes the static output to
# the PUBLIC `flexzora-live` repo (build artifacts only — no source, no docs).
# Requires secret PAGES_DEPLOY_TOKEN (a PAT with repo scope on flexzora-live).

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Build (public demo base path)
        run: npm run build
        env:
          VITE_BASE_PATH: "/flexzora-live/"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: SPA fallback + disable Jekyll
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - name: Publish to SyxNyn3/flexzora-live (gh-pages)
        run: |
          cd dist
          git init -q -b gh-pages .
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -qm "deploy ${{ github.sha }}" || exit 0
          git push -f "https://x-access-token:${{ secrets.PAGES_DEPLOY_TOKEN }}@github.com/SyxNyn3/flexzora-live.git" gh-pages
